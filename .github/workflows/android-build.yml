name: Build Android APK

on:
  push:
    branches: [main, "phase-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter / Dart versions
        run: |
          flutter --version
          dart --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Run unit tests (canonical score test must pass)
        run: |
          echo "## 🧪 Unit Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          if flutter test --no-color --reporter=expanded > test_output.log 2>&1; then
            echo "✅ **All unit tests passed successfully!**" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 25 test_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Unit tests failed!**" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -B 2 -A 8 "\[E\]" test_output.log | head -n 80 >> $GITHUB_STEP_SUMMARY || tail -n 80 test_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi



      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: saagar-audit-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Surface APK download path in summary
        run: |
          echo "### APK build complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the APK from the **Artifacts** section above (named \`saagar-audit-debug-${{ github.sha }}\`)." >> $GITHUB_STEP_SUMMARY
          echo "Transfer to your Android phone, enable 'Install from unknown sources' in the file manager, tap to install." >> $GITHUB_STEP_SUMMARY
